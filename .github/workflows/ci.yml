name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run validate
      - name: Offline evals (no credentials)
        run: npx agent-sdk eval --dir . --tag offline --junit reports/offline.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-evals
          path: |
            reports/
            .agent-serve/evals/
          if-no-files-found: ignore
